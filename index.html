const RTL_LANGS = new Set(['ar','ur','fa']);
const LANG_MAP = {
  'ar':'ar','en':'en','zh':'zh','zh-hans':'zh','zh-hant':'zh','zh-cn':'zh','zh-tw':'zh',
  'fr':'fr','de':'de','es':'es','pt':'pt','it':'it','nl':'nl','ru':'ru',
  'tr':'tr','ja':'ja','ko':'ko','hi':'hi','bn':'bn','ur':'ur','fa':'fa','ms':'ms'
};

function detectLang() {
  const saved = localStorage.getItem('dietsai_lang');
  if (saved && T[saved]) return saved;
  const langs = navigator.languages || [navigator.language || 'en'];
  for (const l of langs) {
    const code = l.toLowerCase();
    if (LANG_MAP[code]) return LANG_MAP[code];
    const short = code.split('-')[0];
    if (LANG_MAP[short]) return LANG_MAP[short];
  }
  return 'en';
}

function render(lang) {
  const t = T[lang];
  const isRTL = RTL_LANGS.has(lang);
  document.documentElement.lang = t.lang;
  document.documentElement.dir = t.dir;
  document.title = t.title;
  document.getElementById('content').innerHTML = `
    <h1>${t.h1}</h1>
    <p class="app-name">${t.subtitle}</p>
    <p class="developer-name">${t.developer}</p>
    <h2>${t.s1}</h2><p>${t.p1}</p>
    <h2>${t.s2}</h2><ul>${t.l2.map(i=>`<li>${i}</li>`).join('')}</ul>
    <h2>${t.s3}</h2><ul>${t.l3.map(i=>`<li>${i}</li>`).join('')}</ul>
    <h2>${t.s4}</h2><p>${t.p4}</p><ul>${t.l4.map(i=>`<li>${i}</li>`).join('')}</ul>
    <h2>${t.s5}</h2><p>${t.p5}</p>
    <h2>${t.s6}</h2><ul>${t.l6.map(i=>`<li>${i}</li>`).join('')}</ul>
    <h2>${t.s7}</h2><p>${t.p7}</p>
    <h2>${t.s8}</h2><p>${t.p8}</p>
    <h2>${t.s9}</h2><p>${t.p9}</p>
    <p><a href="mailto:${t.email}">${t.email}</a></p>
    <p class="update-date">${t.updated}</p>
  `;
  const picker = document.getElementById('langPicker');
  picker.style.direction = isRTL ? 'rtl' : 'ltr';
}

function switchLang(lang) {
  localStorage.setItem('dietsai_lang', lang);
  render(lang);
}

function buildPicker() {
  const picker = document.getElementById('langPicker');
  const current = detectLang();
  Object.keys(T).forEach(code => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = T[code].langName;
    if (code === current) opt.selected = true;
    picker.appendChild(opt);
  });
}

buildPicker();
render(detectLang());
</script>
